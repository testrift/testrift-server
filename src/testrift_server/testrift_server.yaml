# Server configuration file
server:
  # Port number for the server to listen on
  port: 8080

  # Whether to only accept connections from localhost (127.0.0.1)
  # Set to false to allow connections from any IP address
  localhost_only: true

# Data directory for storing test run data
data:
  # Directory path for storing test runs (relative to server directory)
  directory: "data"

  # Default retention days for test runs when not specified by client
  # Set to null or 0 for no automatic cleanup
  default_retention_days: 7

# Attachment configuration
attachments:
  # Whether attachment upload is enabled
  enabled: true

  # Maximum attachment file size (supports B, KB, MB, GB, TB)
  max_size: "10MB"

# User management. Off by default: the UI and APIs stay open to anyone who can reach the server.
auth:
  enabled: false
  allow_local: true
  session_idle_hours: 12
  session_max_days: 7
  password_min_length: 8
  lockout_failures: 5
  lockout_minutes: 15
  ip_lockout_failures: 20
  bootstrap_admin:
    username: admin
    password: "${env:TESTRIFT_BOOTSTRAP_ADMIN_PASSWORD}"
  oidc:
    enabled: false
    issuer: ""
    client_id: "${env:TESTRIFT_OIDC_CLIENT_ID}"
    client_secret: "${env:TESTRIFT_OIDC_CLIENT_SECRET}"
    redirect_uri: ""
    scopes: ["openid", "profile", "email"]
    default_role: member
    role_claim: groups
    role_map: {}
    role_source: local_override
