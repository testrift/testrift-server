<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{ target_key }} - TestRift</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	<link href="/static/app_shell.css" rel="stylesheet">
	<style>
		:root { font-size: 14px; }
		body { margin: 0; color: #30343a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
		.app-shell { width: min(1040px, 100%); margin: 0 auto; overflow: hidden; border-radius: 15px; background: #fff; box-shadow: 0 20px 40px rgba(0,0,0,.14); }
		.header { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 24px 30px; color: #fff; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }.header h1 { margin: 0; font-size: 2.2rem; font-weight: 300; }.header p { margin: 5px 0 0; opacity: .86; }.header a { color: #fff; }
		.content { padding: 24px 30px 30px; }.target-key { color: #6c757d; font-size: .95rem; }.target-key code { color: inherit; }.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }.toolbar .btn { border-radius: 7px; }
		.summary { display: grid; grid-template-columns: repeat(3, minmax(130px, 1fr)); gap: 12px; }.card { padding: 16px; border: 1px solid #e1e5e9; border-radius: 9px; background: #f8f9fa; }.card strong { display: block; font-size: 1.4rem; color: #495057; }.card span { color: #6c757d; font-size: .8rem; text-transform: uppercase; letter-spacing: .4px; }
		.runs { margin-top: 20px; overflow: hidden; border: 1px solid #dfe3e7; border-radius: 10px; box-shadow: 0 3px 12px rgba(0,0,0,.06); }.runs h2 { margin: 0; padding: 15px 18px; border-bottom: 1px solid #e5e8eb; background: #f8f9fa; color: #495057; font-size: 1.15rem; font-weight: 650; }.run-list { padding: 0; margin: 0; list-style: none; }.run-list a { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 18px; color: #337ab7; text-decoration: none; border-top: 1px solid #edf0f2; }.run-list a:hover { background: #f0f2ff; }.empty { padding: 28px; color: #6c757d; text-align: center; }
		@media (max-width: 620px) { .header, .content { padding-right: 16px; padding-left: 16px; }.header { align-items: flex-start; flex-direction: column; }.summary { grid-template-columns: 1fr; } }
	</style>
</head>
<body class="app-layout">
	{% include '_sidebar.html' %}
	<div class="app-main">
	<main class="app-shell">
		<header class="header"><div><h1><i class="fas fa-crosshairs me-2"></i><span id="target-name">{{ target_key }}</span></h1><p>Stable Target history and run context</p></div><a class="btn btn-outline-light btn-sm" href="/targets"><i class="fas fa-arrow-left me-1"></i>All Targets</a></header>
		<section class="content">
			<div class="target-key">Target key from client: <code>{{ target_key }}</code></div>
			<div class="toolbar"><a class="btn btn-outline-primary btn-sm" href="/targets/{{ target_key }}/analyzer"><i class="fas fa-chart-line me-1"></i>Analyzer</a><a class="btn btn-outline-primary btn-sm" href="/targets/{{ target_key }}/matrix"><i class="fas fa-table-cells me-1"></i>Matrix</a><a class="btn btn-outline-primary btn-sm" href="/targets/{{ target_key }}/failures"><i class="fas fa-bug me-1"></i>Failures</a></div>
			<div class="summary"><div class="card"><strong id="run-count">--</strong><span>Runs</span></div><div class="card"><strong id="setup-state">--</strong><span>Setup status</span></div><div class="card"><strong id="collection-count">--</strong><span>Collections</span></div></div>
			<section class="runs"><h2><i class="fas fa-list me-2"></i>Run history</h2><ul id="runs" class="run-list"></ul></section>
		</section>
	</main>
	</div>
	<script>
		const targetKey = {{ target_key | tojson }};
		const request = async url => { const response = await fetch(url); const body = await response.json(); if (!response.ok || !body.success) throw new Error(body.error || 'Request failed'); return body.data; };
		Promise.all([request(`/api/targets/${targetKey}`), request(`/api/run-set?target=${targetKey}`), request('/api/collections')]).then(async ([target, runSet, collectionSummaries]) => {
			const collections = await Promise.all(collectionSummaries.map(collection => request(`/api/collections/${encodeURIComponent(collection.key)}`)));
			document.getElementById('target-name').textContent = target.display_name;
			document.getElementById('run-count').textContent = runSet.run_ids.length;
			document.getElementById('setup-state').textContent = target.setup_state === 'ready' ? 'Ready' : 'Needs setup';
			document.getElementById('collection-count').textContent = collections.filter(collection => collection.targets.some(member => member.id === target.id)).length;
			document.getElementById('runs').innerHTML = runSet.run_ids.map(id => `<li><a href="/testRun/${encodeURIComponent(id)}/index.html"><span>${id}</span><i class="fas fa-arrow-right"></i></a></li>`).join('') || '<li class="empty">No Runs for this Target.</li>';
		}).catch(error => { document.getElementById('runs').innerHTML = `<li class="empty">${error.message}</li>`; });
	</script>
</body>
</html>
