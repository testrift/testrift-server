<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ target_key }} - TestRift</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-4"><a href="/">All Runs</a><h1 class="mt-3">{{ target_key }}</h1><p id="run-count" class="text-muted"></p><div class="btn-group flex-wrap"><a class="btn btn-outline-primary" href="/targets/{{ target_key }}/analyzer">Analyzer</a><a class="btn btn-outline-primary" href="/targets/{{ target_key }}/matrix">Matrix</a><a class="btn btn-outline-primary" href="/targets/{{ target_key }}/failures">Failures</a><a class="btn btn-outline-primary" href="/api/test-runs?target={{ target_key }}">Runs API</a></div><div id="runs" class="list-group mt-4"></div></main><script>fetch('/api/run-set?target={{ target_key }}').then(r=>r.json()).then(result=>{if(!result.success)throw new Error(result.error);document.getElementById('run-count').textContent=`${result.data.run_ids.length} Runs`;document.getElementById('runs').innerHTML=result.data.run_ids.map(id=>`<a class="list-group-item list-group-item-action" href="/testRun/${id}/index.html">${id}</a>`).join('')||'<div class="text-muted">No Runs for this Target.</div>';}).catch(error=>document.getElementById('run-count').textContent=error.message);</script></body></html>
