<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - TestRift</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef0f7;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 28px 30px;
      text-align: center;
    }
    .login-header h1 {
      margin: 0;
      font-weight: 300;
      font-size: 2rem;
    }
    .login-body { padding: 28px 30px 32px; }
    .error {
      display: none;
      background: #f8d7da;
      color: #721c24;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }
    .btn-signin {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      color: white;
      width: 100%;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
    }
    .btn-signin:hover { color: white; opacity: 0.95; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1><i class="fas fa-vial"></i> TestRift</h1>
      <div>Sign in to continue</div>
    </div>
    <div class="login-body">
      <div id="login-error" class="error" role="alert"></div>
      <form id="login-form">
        <input type="hidden" name="next" value="{{ next_url|e }}">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input id="username" name="username" class="form-control" autocomplete="username" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button class="btn btn-signin" type="submit">Sign in</button>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.style.display = 'none';
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const nextUrl = form.elements.next.value || '/';
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password})
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
          errorEl.textContent = data.error || 'Invalid username or password.';
          errorEl.style.display = 'block';
          return;
        }
        window.location.href = nextUrl.startsWith('/') ? nextUrl : '/';
      } catch (error) {
        errorEl.textContent = 'Could not sign in. Try again.';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
