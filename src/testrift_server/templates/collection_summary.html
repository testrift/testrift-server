<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ collection_key }} Summary - TestRift</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { font-size: 14px; }
    body { min-height: 100vh; margin: 0; color: #30343a; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .app-shell { width: min(1180px, calc(100% - 32px)); margin: 20px auto; overflow: hidden; border-radius: 15px; background: #fff; box-shadow: 0 20px 40px rgba(0,0,0,.14); }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 24px 30px; color: #fff; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }.header h1 { margin: 0; font-size: 2.2rem; font-weight: 300; }.header p { margin: 5px 0 0; opacity: .86; }.header a { color: #fff; }
    .content { padding: 24px 30px 30px; }.summary-head { display: flex; justify-content: space-between; gap: 16px; align-items: end; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid #e5e8eb; }.summary-head h2 { margin: 0; color: #495057; font-size: 1.4rem; font-weight: 650; }.summary-head label { color: #495057; font-weight: 650; }.summary-head select { min-width: 220px; margin-top: 5px; }
    .context { margin-top: 14px; padding: 11px 14px; border: 1px solid #dfe3e7; border-radius: 8px; background: #f8f9fa; color: #6c757d; font-size: .86rem; }.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 20px; }.tile { min-height: 132px; padding: 16px; border: 1px solid #dfe3e7; border-radius: 9px; background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.06); }.tile.no-match { border-left: 4px solid #c47f00; }.tile.match { border-left: 4px solid #198754; }.tile strong { display: block; color: #343a40; font-size: 1.05rem; }.detail { margin-top: 8px; color: #6c757d; font-size: .87rem; overflow-wrap: anywhere; }.empty { padding: 30px; color: #6c757d; text-align: center; }
    @media (max-width: 620px) { .app-shell { width: 100%; margin: 0; border-radius: 0; }.header, .content { padding-right: 16px; padding-left: 16px; }.header { align-items: flex-start; flex-direction: column; }.summary-head { align-items: stretch; }.summary-head select { width: 100%; } }
  </style>
</head>
<body>
<main class="app-shell">
  <header class="header"><div><h1><i class="fas fa-layer-group me-2"></i>{{ collection_key }}</h1><p>Combined Target overview</p></div><a class="btn btn-outline-light btn-sm" href="/"><i class="fas fa-arrow-left me-1"></i>Test Runs</a></header>
  <section class="content"><div class="summary-head"><div><h2 id="collection-name">{{ collection_key }}</h2><div id="profile-details" class="text-muted mt-1"></div></div><label>Summary profile<select id="profile" class="form-select"></select></label></div><div id="summary-time" class="context"></div><div id="tools" class="tools"></div><div id="tiles" class="tiles"></div></section>
</main>
<script>
const collectionKey = {{ collection_key | tojson }};
const api = async url => { const response = await fetch(url); const body = await response.json(); if (!response.ok || !body.success) throw new Error(body.error || 'Request failed'); return body.data; };
async function load() {
  const collection = await api(`/api/collections/${collectionKey}`);
  document.getElementById('collection-name').textContent = collection.display_name;
  const select = document.getElementById('profile');
  select.innerHTML = collection.profiles.map(profile => `<option value="${profile.id}">${profile.name}</option>`).join('');
  select.value = collection.profiles.find(profile => profile.is_primary)?.id || collection.profiles[0]?.id || '';
  select.onchange = render;
  await render();
}
async function render() {
  const profileId = document.getElementById('profile').value;
  if (!profileId) { document.getElementById('tiles').innerHTML = '<div class="empty">No Summary profile configured.</div>'; document.getElementById('summary-time').textContent = 'Create a Summary profile in Settings to select a deterministic run set.'; return; }
  const at = new URLSearchParams(window.location.search).get('at') || new Date().toISOString();
  const [collection, selections] = await Promise.all([api(`/api/collections/${collectionKey}`), api(`/api/collections/${collectionKey}/summary?profile_id=${profileId}&at=${encodeURIComponent(at)}`)]);
  const profile = collection.profiles.find(item => String(item.id) === profileId);
  document.getElementById('summary-time').textContent = `Requested at ${at}`;
  document.getElementById('profile-details').textContent = `${profile.purpose}, ${profile.window_hours}h window`;
  const context = `profile_id=${encodeURIComponent(profileId)}&at=${encodeURIComponent(at)}`;
  document.getElementById('tools').innerHTML = ['analyzer', 'matrix', 'failures'].map(tool =>
    `<a class="btn btn-outline-primary btn-sm me-2" href="/collections/${collectionKey}/${tool}?${context}">${tool[0].toUpperCase() + tool.slice(1)}</a>`
  ).join('');
  document.getElementById('tiles').innerHTML = selections.map(selection => selection.run_id
    ? `<article class="tile match"><strong>${selection.target_key}</strong><div class="detail">Selected Run</div><a href="/testRun/${selection.run_id}/index.html">${selection.run_id}</a><div class="detail"><a href="/api/test-runs?target=${selection.target_key}">Target history</a></div></article>`
    : `<article class="tile no-match"><strong>${selection.target_key}</strong><div class="detail">No matching run</div></article>`).join('');
}
load().catch(error => document.getElementById('tiles').textContent = error.message);
</script>
</body>
</html>
